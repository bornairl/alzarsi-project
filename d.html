<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Brand Product Showcase</title>
    <style>
        /* Base Reset & Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #1a1a1a;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.03em;
        }

        header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* Bento Grid Hero Layout */
        .bento-hero {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 220px;
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Generic Bento Box Item */
        .bento-item {
            position: relative;
            background-color: #e5e5e5;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
            text-decoration: none;
            color: white;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s ease;
        }

        .bento-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }

        /* Custom Content Overlay Gradient */
        .bento-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 70%, rgba(0,0,0,0) 100%);
            z-index: 1;
        }

        .bento-content {
            position: relative;
            z-index: 2;
        }

        .bento-item .brand-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            backdrop-filter: blur(4px);
        }

        .bento-item h2 {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
        }

        /* Bento Grid Item Placements */
        /* Feature Box 1: Large Anchor */
        .item-featured {
            grid-column: span 2;
            grid-row: span 2;
            background: #2a3d45 url('https://unsplash.com') center/cover no-repeat;
        }
        
        .item-featured h2 {
            font-size: 2.2rem;
        }

        /* Feature Box 2: Tall Column */
        .item-tall {
            grid-column: span 1;
            grid-row: span 2;
            background: #7a6f5d url('https://unsplash.com') center/cover no-repeat;
        }

        /* Feature Box 3 & 4: Standard Blocks */
        .item-standard-1 {
            grid-column: span 1;
            grid-row: span 1;
            background: #4a5759 url('https://unsplash.com') center/cover no-repeat;
        }

        .item-standard-2 {
            grid-column: span 1;
            grid-row: span 1;
            background: #dedbd2 url('https://unsplash.com') center/cover no-repeat;
        }

        /* Responsive Breakpoints */
        @media (max-width: 900px) {
            .bento-hero {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 200px;
            }
            .item-featured {
                grid-column: span 2;
            }
            .item-tall {
                grid-column: span 1;
                grid-row: span 1;
            }
        }

        @media (max-width: 600px) {
            .bento-hero {
                grid-template-columns: 1fr;
                grid-auto-rows: 240px;
            }
            .item-featured, .item-tall, .item-standard-1, .item-standard-2 {
                grid-column: span 1;
                grid-row: span 1;
            }
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header Replacement for Traditional Single Hero -->
        <header>
            <h1>Curated Collaborations</h1>
            <p>Discover flagship releases from our premium brand partners.</p>
        </header>

        <!-- Bento Box Hybrid Hero Grid -->
        <section class="bento-hero">
            
            <!-- Box 1: Core Showcase Brand/Product -->
            <a href="#" class="bento-item item-featured">
                <div class="bento-content">
                    <span class="brand-tag">Acoustics Pro</span>
                    <h2>Studio Wireless Edition Studio Headphones</h2>
                </div>
            </a>

            <!-- Box 2: Secondary Visual Anchor -->
            <a href="#" class="bento-item item-tall">
                <div class="bento-content">
                    <span class="brand-tag">Chronos</span>
                    <h2>Minimalist Minimalist Timepieces</h2>
                </div>
            </a>

            <!-- Box 3: Third Brand Spot -->
            <a href="#" class="bento-item item-standard-1">
                <div class="bento-content">
                    <span class="brand-tag">Velo Sport</span>
                    <h2>Aerodynamic Performance Performance Footwear</h2>
                </div>
            </a>

            <!-- Box 4: Fourth Brand Spot -->
            <a href="#" class="bento-item item-standard-2">
                <div class="bento-content">
                    <span class="brand-tag">Lumos Eyewear</span>
                    <h2>UV-Protected Luxury Sunglasses</h2>
                </div>
            </a>

        </section>

    </div>

</body>
</html>
